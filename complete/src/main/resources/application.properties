# Automatically update the database schema based on JPA entity classes when the application starts.
spring.jpa.hibernate.ddl-auto=update

# Display SQL statements generated by Hibernate in the console for debugging.
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/mydb
spring.datasource.username=myuser
spring.datasource.password=secretdb
